name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # All extras: the fast suite exercises export and the hosted backend, and a
      # suite that silently skips them is not the gate it claims to be.
      - run: uv sync --all-extras --group dev
      # Device-marked tests are excluded by default: they need real hardware and a
      # host quiet enough to pass the gate, neither of which a CI runner is.
      - run: uv run pytest -q
      - run: uv run ruff check .

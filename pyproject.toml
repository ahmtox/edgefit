[project]
name = "edgefit"
version = "0.1.1"
description = "Neutral, reproducible measurement of on-device AI inference, across silicon vendors"
readme = "README.md"
# 3.13 verified: onnxruntime, duckdb, pyarrow and onnx all publish wheels for it.
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Alan Morelos" }]
keywords = [
    "on-device", "edge-ai", "inference", "benchmark", "onnxruntime",
    "coreml", "qualcomm", "npu", "quantization", "latency",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Benchmark",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
]

# Runtime path only. Anything needed purely to *produce* a model artifact belongs
# in the `export` extra — the Tier-3 self-hosted runner (PROJECT.md §8) ships this
# dependency set and nothing more, so it must stay thin and torch-free.
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "duckdb>=1.0",
    "pyarrow>=16",
    "onnx>=1.16",
    "onnxruntime>=1.19",
    # fp16 graph conversion. Tiny, pure Python, and fp16 is a first-class
    # on-device dtype — the Apple Neural Engine is fp16-native.
    "onnxconverter-common>=1.14",
    "numpy>=1.26,<3",
    "psutil>=5.9",
    "pyyaml>=6",
    "rich>=13",
    # DuckDB requires pytz to hand TIMESTAMPTZ columns back to Python. Without it
    # any query selecting created_at raises at fetch time.
    "pytz>=2024.1",
    # Unprivileged thermal state + low-power-mode via NSProcessInfo. macOS only.
    "pyobjc-framework-Cocoa>=10; sys_platform == 'darwin'",
]

[project.urls]
Homepage = "https://ahmtox.github.io/edgefit"
Atlas = "https://ahmtox.github.io/edgefit"
Source = "https://github.com/ahmtox/edgefit"
Issues = "https://github.com/ahmtox/edgefit/issues"

[project.optional-dependencies]
# Model ingestion / lowering. Not required to replay a measurement.
export = [
    "torch>=2.4",
    "transformers>=4.44",
]
# Qualcomm AI Hub client, for refreshing the hosted device catalogue. Optional:
# the inventory reads a cached copy, so nothing in the core path needs it.
qai-hub = [
    "qai-hub>=0.54",
]

[project.scripts]
edgefit = "edgefit.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edgefit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# A bare `pytest` is the fast suite. Hardware-touching tests need a gated, idle
# host and are reached through `edgefit verify` (or an explicit `-m device`),
# so they must not run by accident and report a host problem as a code problem.
addopts = "-m 'not device'"
markers = [
    "device: requires exclusive, gated access to real hardware (slow)",
    "export: requires the `export` extra (torch/transformers)",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Verbatim CSS and JS in string literals. Reflowing them to fit a Python line
# limit makes the stylesheet harder to read, not easier.
"src/edgefit/atlas/assets.py" = ["E501"]
